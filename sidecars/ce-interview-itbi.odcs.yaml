apiVersion: v3.2.0
kind: DataContract
id: ce-interview-itbi
name: ce_interview_itbi
version: 0.1.0
status: draft
domain: consumer-expenditure
dataProduct: ce-interview-survey
tenant: TBD
description:
  purpose: 'Consumer unit income by item code (UCC) and reference month, from the BLS Consumer
    Expenditure Interview Survey.

    '
  limitations: 'The table carries no weight: sum its rows to newid, then use the weight of
    the fmli row with the same newid. An interview with no income item rows counts as zero,
    not as missing. Whether value is a monthly amount or a monthly share of an annual one
    is not settled, so its unit is under review. See the master sidecar for the survey design.

    '
  usage: 'Income by item and reference month.

    '
authoritativeDefinitions:
- type: businessDefinition
  url: https://www.bls.gov/cex/pumd-getting-started-guide.htm
  description: BLS public-use microdata getting started guide.
- type: glossary
  url: vocabulary.yaml#properties
  description: 'Definitions of the ce: custom properties used in this contract.'
context:
  instructions: 'This contract describes one table of the CE Interview Survey. Read the master
    sidecar named in ce:master for the survey design and for how this table relates to the
    others, and the vocabulary it names for the meaning of each ce: property.

    '
  constraints:
  - id: c-master-required
    constraint: 'Do not interpret this table without the master sidecar; the survey design
      is not described here.

      '
    tags:
    - master-sidecar
customProperties:
- property: ce:master
  value:
    id: ce-interview-master
    version: 0.1.0
schema:
- name: itbi
  id: itbi
  physicalName: itbi
  physicalType: table
  businessName: CE Interview income file
  description: One row per income item (UCC) per reference month.
  tags:
  - survey
  - income
  - monthly
  customProperties:
  - property: ce:rowRepresents
    value: income_item_month
  - property: ce:rowKey
    value:
    - newid
    - ucc
    - refyr
    - refmo
  quality:
  - metric: duplicateValues
    mustBe: 0
    description: The row key (newid, ucc, refyr, refmo) is unique across the stored table.
    dimension: uniqueness
    type: library
    severity: error
  properties:
  - name: newid
    id: newid
    businessName: Public use microdata identifier
    logicalType: string
    required: true
    description: Public use microdata identifier
    customProperties:
    - property: ce:sourceName
      value: NEWID
    - property: ce:role
      value: identifier
    - property: ce:scale
      value: nominal
  - name: cuid
    id: cuid
    businessName: Consumer unit identifier
    logicalType: string
    required: true
    description: 'The consumer unit, shared by all its interviews: newid without its last
      digit, added by the loader. Where BLS supplies CUID (fmli, fmld) it is kept, padded
      to 7 digits, and checked against newid.'
    quality:
    - metric: nullValues
      mustBe: 0
      description: Every interview belongs to a consumer unit.
      dimension: completeness
      type: library
      severity: error
    customProperties:
    - property: ce:role
      value: identifier
    - property: ce:scale
      value: nominal
  - name: refmo
    id: refmo
    businessName: Reference Month of this expenditure
    logicalType: string
    required: true
    description: Reference Month of this expenditure
    customProperties:
