        scheme: ucc
        source: VERIFY
  - name: pubflag
    id: pubflag
    businessName: Is amount included in published reports?
    logicalType: string
    description: Is amount included in published reports?
    enum:
    - value: '1'
      label: Not published
    - value: '2'
      label: Published in Integrated Bulletin
    customProperties:
    - property: ce:sourceName
      value: PUBFLAG
    - property: ce:role
      value: dimension
    - property: ce:scale
      value: nominal
  - name: value
    id: value
    businessName: Value of UCC
    logicalType: number
    description: 'One twelfth of the item''s 12-month figure, repeated on each of the interview''s
      three reference months. For income item codes it is dollars; item codes 980010 to 980360
      hold consumer unit characteristics (counts, ages, percentages) stored the same way.

      '
    tags:
    - needs-review
    - review:verify
    customProperties:
    - property: ce:sourceName
      value: VALUE
    - property: ce:role
      value: measure
    - property: ce:scale
      value: ratio
    - property: ce:unit
      value: VERIFY
    - property: ce:level
      value: consumer_unit
    - property: ce:topcoded
      value: true
    - property: ce:topcodeMethod
      value: replaced_by_mean_above_critical_value
  - name: value_
    id: value_
    businessName: Flag for value
    logicalType: string
    description: 'Data flag for value: BLS''s Interview Survey flag codes.'
    enum:
    - value: A
      label: Valid blank; no response was expected
    - value: B
      label: Invalid blank; nonresponse inconsistent with other data reported
    - value: C
      label: Blank from "don't know", refusal, or other nonresponse
