  - name: fincbtxi
    id: fincbtxi
    businessName: Indicator/descriptor variable for income imputation
    logicalType: number
    description: Indicator/descriptor variable for income imputation.
    enum:
    - value: 100
      label: No imputation. This would be the case only if ALL the variables that are summed
        to get the summary variables are not imputed.
    - value: 2nn
      label: Imputation due to invalid blanks only. This would be the case if there are no
        bracketed responses, and at least one value is imputed because of invalid blanks.
    - value: 3nn
      label: Imputation due to brackets only. This would be the case if there are no invalid
        blanks, and there is at least 1 bracketed response.
    - value: 4nn
      label: Imputation due to invalid blanks AND bracketing. Note that when no imputation
        occurs, the assigned code value is 100 at both the individual source level and at
        the summary level.
    - value: 5nn
      label: Imputation due to conversion of valid blanks to invalid blanks. (Occurs only
        when initial values for all sources of income for the consumer unit were valid blanks).
    customProperties:
    - property: ce:sourceName
      value: FINCBTXI
    - property: ce:role
      value: dimension
    - property: ce:scale
      value: nominal
