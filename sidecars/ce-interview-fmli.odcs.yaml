status: draft
domain: consumer-expenditure
dataProduct: ce-interview-survey
tenant: TBD
description:
  purpose: 'Household-level (consumer unit) characteristics, income, and summary expenditures
    from the BLS Consumer Expenditure Interview Survey.

    '
  limitations: 'A consumer unit can appear in up to four quarterly interviews. Values are
    subject to top-coding, imputation, coded missing values, and skip patterns. See the master
    sidecar for the survey design.

    '
  usage: 'Consumer-unit characteristics, income, and summary expenditures. This is the table
    that carries the sampling weight and replicate weights.

    '
authoritativeDefinitions:
- type: businessDefinition
  url: https://www.bls.gov/cex/pumd-getting-started-guide.htm
  description: BLS public-use microdata getting started guide.
- type: glossary
  url: vocabulary.yaml#properties
  description: 'Definitions of the ce: custom properties used in this contract.'
context:
  instructions: 'This contract describes one table of the CE Interview Survey. Read the master
    sidecar named in ce:master for the survey design and for how this table relates to the
    others, and the vocabulary it names for the meaning of each ce: property.

    '
  verifiedStatements:
  - id: vs-unit
    question: What does one row represent?
    answer: 'One consumer unit in one quarterly interview. The same consumer unit (cuid) can
      appear in up to four interviews, at most one per quarter.

      '
  - id: vs-weight
    question: Which column is the sampling weight?
    answer: finlwt21. Each quarter's weights sum to all US consumer units.
  - id: vs-newid
    question: How is newid built?
    answer: 'An 8-digit string. The last digit is the interview number, in a series of four;
      the seven digits before it are the consumer unit, stored as cuid.

      '
  constraints:
  - id: c-master-required
    constraint: 'Do not interpret this table without the master sidecar; the survey design
      is not described here.

      '
