# the meaning of each "ce:" property is in vocabulary.yaml.

apiVersion: v3.2.0
kind: DataContract
id: ce-interview-itii
name: ce_interview_itii
version: 0.1.0
status: draft
domain: consumer-expenditure
dataProduct: ce-interview-survey
tenant: TBD
description:
  purpose: 'The five imputed versions of consumer unit income by item code (UCC) and reference
    month, from the BLS Consumer Expenditure Interview Survey.

    '
  limitations: 'Each income item and month has five rows, one per imputed version (impnum
    1 to 5). Estimate with each version and average the five; using one version understates
    uncertainty. The table carries no weight: sum its rows to newid within a version, then
    use the weight of the fmli row with the same newid. See the master sidecar for the survey
    design.

    '
  usage: 'Imputed income by item and reference month.

    '
authoritativeDefinitions:
- type: businessDefinition
  url: https://www.bls.gov/cex/pumd-getting-started-guide.htm
  description: BLS public-use microdata getting started guide.
- type: glossary
  url: vocabulary.yaml#properties
  description: 'Definitions of the ce: custom properties used in this contract.'
context:
  instructions: 'This contract describes one table of the CE Interview Survey. Read the master
    sidecar named in ce:master for the survey design and for how this table relates to the
    others, and the vocabulary it names for the meaning of each ce: property.

    '
  constraints:
  - id: c-master-required
    constraint: 'Do not interpret this table without the master sidecar; the survey design
      is not described here.

      '
    tags:
    - master-sidecar
customProperties:
- property: ce:master
  value:
    id: ce-interview-master
    version: 0.1.0
schema:
- name: itii
  id: itii
  physicalName: itii
  physicalType: table
  businessName: CE Interview imputed income file
  description: One row per imputed version of an income item per reference month.
  tags:
  - survey
  - income
  - imputed
  - monthly
  customProperties:
  - property: ce:rowRepresents
    value: imputed_income_item_month
  - property: ce:rowKey
    value:
    - newid
    - ucc
    - refyr
    - refmo
    - impnum
  quality:
  - metric: duplicateValues
    mustBe: 0
    description: The row key (newid, ucc, refyr, refmo, impnum) is unique across the stored
      table.
    dimension: uniqueness
    type: library
    severity: error
  properties:
  - name: newid
    id: newid
    businessName: Public use microdata identifier
    logicalType: string
    required: true
    description: Public use microdata identifier
    customProperties:
    - property: ce:sourceName
      value: NEWID
    - property: ce:role
      value: identifier
    - property: ce:scale
      value: nominal
  - name: cuid
    id: cuid
    businessName: Consumer unit identifier
    logicalType: string
    required: true
    description: 'The consumer unit, shared by all its interviews: newid without its last
      digit, added by the loader. Where BLS supplies CUID (fmli, fmld) it is kept, padded
      to 7 digits, and checked against newid.'
    quality:
    - metric: nullValues
      mustBe: 0
      description: Every interview belongs to a consumer unit.
      dimension: completeness
      type: library
      severity: error
    customProperties:
    - property: ce:role
      value: identifier
    - property: ce:scale
      value: nominal
  - name: refmo
    id: refmo
    businessName: Reference Month of this expenditure
    logicalType: string
    required: true
    description: Reference Month of this expenditure
    customProperties:
    - property: ce:sourceName
      value: REFMO
    - property: ce:role
      value: period
    - property: ce:scale
      value: ordinal
  - name: refyr
    id: refyr
    businessName: Reference Year of this expenditure
    logicalType: string
    required: true
    description: Reference Year of this expenditure
    customProperties:
    - property: ce:sourceName
      value: REFYR
    - property: ce:role
      value: period
    - property: ce:scale
      value: interval
  - name: ucc
    id: ucc
    businessName: Universal Classification Code
    logicalType: string
    required: true
    description: Universal Classification Code
    enum:
    - value: '800940'
      label: Deductions for Social Security
    - value: '900000'
      label: Wages and salaries
    - value: '900030'
      label: Social Security and railroad retirement income
    - value: '900090'
      label: Supplemental security income
    - value: '900120'
      label: Public assistance
    - value: '900140'
      label: Other income
    - value: '900150'
      label: Food stamps
    - value: '900160'
      label: Self-employment income
    - value: '900170'
      label: Retirement, survivors, disability income
    - value: '900180'
      label: Interest and dividends
    - value: '900190'
      label: Net room/rental income
    - value: '900200'
      label: Royalty, estate, trust income
    - value: '900210'
      label: Other regular income
    - value: '980000'
      label: Income before taxes
    tags:
    - needs-review
    - review:verify
    - review:unknown-codes
    customProperties:
    - property: ce:sourceName
      value: UCC
    - property: ce:role
      value: item_code
    - property: ce:scale
      value: nominal
    - property: ce:codeHierarchy
      value:
        scheme: ucc
        source: VERIFY
  - name: pubflag
    id: pubflag
    businessName: Is amount included in published reports?
    logicalType: string
    description: Is amount included in published reports?
    enum:
    - value: '1'
      label: Not published
    - value: '2'
      label: Published in Integrated Bulletin
    customProperties:
    - property: ce:sourceName
      value: PUBFLAG
    - property: ce:role
      value: dimension
    - property: ce:scale
      value: nominal
  - name: value
    id: value
    businessName: Value of UCC
    logicalType: number
    description: 'One twelfth of the item''s 12-month figure, repeated on each of the interview''s
      three reference months. For income item codes it is dollars; item codes 980010 to 980360
      hold consumer unit characteristics (counts, ages, percentages) stored the same way.

      '
    tags:
    - needs-review
    - review:verify
    customProperties:
    - property: ce:sourceName
      value: VALUE
    - property: ce:role
      value: measure
    - property: ce:scale
      value: ratio
    - property: ce:unit
      value: VERIFY
    - property: ce:level
      value: consumer_unit
    - property: ce:topcoded
      value: true
    - property: ce:topcodeMethod
      value: replaced_by_mean_above_critical_value
    - property: ce:imputed
      value:
        multiple: true
        iterations: 5
  - name: value_
    id: value_
    businessName: Flag for value
    logicalType: string
    description: 'Data flag for value: BLS''s Interview Survey flag codes.'
    enum:
    - value: A
      label: Valid blank; no response was expected
    - value: B
      label: Invalid blank; nonresponse inconsistent with other data reported
    - value: C
      label: Blank from "don't know", refusal, or other nonresponse
    - value: D
      label: Valid value, unadjusted
    - value: E
      label: Valid value, allocated
    - value: F
      label: Valid value, imputed or adjusted in some other way
    - value: G
      label: Valid value, allocated and imputed
    - value: H
      label: Valid blank; a parent record whose amount was allocated to other records
    - value: T
      label: Top-coded or suppressed
    - value: U
      label: Allocated, then top-coded or suppressed
    - value: V
      label: Imputed or adjusted, then top-coded or suppressed
    - value: W
      label: Allocated and imputed, then top-coded or suppressed
    customProperties:
    - property: ce:sourceName
      value: VALUE_
    - property: ce:role
      value: flag
    - property: ce:flagFor
      value: value
    - property: ce:flagMeanings
      value:
        A: skip_pattern
        B: nonresponse
        C: nonresponse
        D: valid
        E: allocated
        F: imputed
        G:
        - allocated
        - imputed
        H: parent_record
        T: topcoded
        U:
        - allocated
        - topcoded
        V:
        - imputed
        - topcoded
        W:
        - allocated
        - imputed
        - topcoded
  - name: impnum
    id: impnum
    businessName: Income Imputation Iteration
    logicalType: string
    required: true
    description: Income Imputation Iteration
    enum:
    - value: '1'
      label: First
    - value: '2'
      label: Second
    - value: '3'
      label: Third
    - value: '4'
      label: Fourth
    - value: '5'
      label: Fifth
    customProperties:
    - property: ce:sourceName
      value: IMPNUM
    - property: ce:role
      value: identifier
    - property: ce:scale
      value: nominal
  - name: quarter
    id: quarter
    businessName: Quarter (1-4)
    logicalType: integer
    required: true
    description: Added by the loader, from the file name.
    customProperties:
    - property: ce:role
      value: period
    - property: ce:scale
      value: ordinal
  - name: quarter_code
    id: quarter_code
    businessName: Quarter code (partition)
    logicalType: string
    required: true
    description: 'Added by the loader, from the file name: 1x is quarter 1 of the release
      year, 1 is quarter 1 of the following year.'
    enum:
    - value: 1x
    - value: '1'
    - value: '2'
    - value: '3'
    - value: '4'
    customProperties:
    - property: ce:role
      value: period
    - property: ce:scale
      value: nominal
  - name: survey_year
    id: survey_year
    businessName: Survey year (partition)
    logicalType: integer
    required: true
    description: Added by the loader, from the file name.
    customProperties:
    - property: ce:role
      value: period
    - property: ce:scale
      value: interval
tags:
- bls
- consumer-expenditure
- survey
