# Table sidecar for the CE Interview Survey itii table, written against the
# Open Data Contract Standard (ODCS) v3.2.0.
#
# Status: draft, version 0.1.0. GENERATED by `ce-sidecars generate` from the
# BLS data dictionary (2025 release), the loader's stored table and
# source_columns, the master sidecar, and overrides/ce-interview-itii.yaml. Do not
# edit it by hand: change the overrides file and generate it again.
# Not yet validated against the ODCS JSON Schema.
#
# Columns that still need a person's decision are tagged needs-review, with a
