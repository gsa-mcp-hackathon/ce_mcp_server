# MASTER sidecar for the CE Interview Survey, written against the Open Data
# Contract Standard (ODCS) v3.2.0.
#
# Status: draft, version 0.1.0. Not yet validated against the ODCS JSON Schema.
#
# Scope: the facts shared by every Interview table (survey design, weight,
# replicate weights, variance method, reference period, breaks, geography
# levels), the list of table sidecars, and the relationships between them.
# It describes no columns; each table sidecar does that and points here
# through ce:master. The meaning of each "ce:" property is in the vocabulary
# named by ce:vocabulary (vocabulary.yaml).
#
# Tables listed: the five core tables of the 2025 release, written by hand, and
# its 43 detailed expenditure (expn_*) tables. The expn entries in ce:tables and
# ce:relationships sit between marker lines and are written by
# `ce-sidecars sync-master` from the stored tables: do not edit them by hand.

apiVersion: v3.2.0
kind: DataContract
id: ce-interview-master
name: ce_interview_master
version: 0.1.0
status: draft
domain: consumer-expenditure
dataProduct: ce-interview-survey
tenant: TBD

description:
  purpose: >
    The survey design and the table set of the BLS Consumer Expenditure
    Interview Survey public-use microdata, as loaded: what every table shares,
    which tables exist, and how they join.
  limitations: >
    Describes the 2025 release. Facts that change between releases (variance
    method, breaks) are recorded by release.
  usage: >
    Read this file before any table sidecar. It names the weight, how
    standard errors are computed, and how each table reaches the weight.

authoritativeDefinitions:
  - type: businessDefinition
    url: https://www.bls.gov/cex/pumd-getting-started-guide.htm
    description: BLS public-use microdata getting started guide.
  - type: businessDefinition
    url: https://www.bls.gov/cex/ce-standarderrors.htm
    description: BLS guidance on standard errors for CE estimates.
  - type: businessDefinition
    url: https://www.bls.gov/cex/ce-pumd-2025-shutdown-impact.htm
    description: BLS note on the 2025 collection gap and the microdata.
  - type: glossary
    url: vocabulary.yaml#properties
    description: "Definitions of the ce: custom properties used in this contract."

context:
  instructions: >
    This is the master sidecar for the CE Interview Survey. Use ce:weight for
    every population estimate and ce:variance for standard errors. A table
    other than the one that carries the weight reaches it only through a
    ce:relationships entry with weightFrom parent: sum its rows to the
    parent's key first, then apply the parent's weight. Links with
    weightFrom self group rows of one unit and never route a weight.
  constraints:
    - id: c-weight-route
      constraint: >
        Never add weights across a same_unit link: one consumer unit has up to
        four interviews, each carrying its own weight.
      tags: [ 'weights' ]
    - id: c-2025-gap-unadjusted
      constraint: >
        The 2025 microdata is not adjusted for the collection gap
        (BRK_2025_COLLECTION_GAP). BLS adjusted its published 2025 estimates
        but not the microdata: fourth-quarter 2025 interviews (December only)
        represent one third of the usual number of consumer units. State
        whether a 2025 estimate is as released or adjusted to mimic the
        published figures. The adjustment is applied at estimation time: BLS
        gives replacement months-in-scope values (3.5 and 5.5 for some
        interview months) and factors on monthly amounts for July to October.
        The stored mo_scope stays the standard value.
      tags: [ 'breaks', 'weights' ]
    - id: c-state-weights
      constraint: >
        No state estimate for the 2025 release has a supporting weight. BLS
        research state weights covered California, Florida, New York and
        Texas for 2017 to 2023 and New Jersey for 2017 to 2020; none exist
        after 2023. A state estimate rests on the national weight alone and
        needs that caveat.
      tags: [ 'geography', 'weights' ]

customProperties:
  # ── Pointer and release ──────────────────────────────────────────────────
  - property: ce:vocabulary
    value: {id: ce-vocabulary, version: 0.1.3}
  - property: ce:sourceRelease
    value: 2025

  # ── Survey design ────────────────────────────────────────────────────────
  - property: ce:targetPopulation
    value: US civilian noninstitutional population, as consumer units
  - property: ce:design
    value: {type: rotating_panel, maxInterviews: 4, panelId: cuid}
  - property: ce:weight
    value: {table: ce-interview-fmli, column: finlwt21}
  - property: ce:replicateWeights
    value: {table: ce-interview-fmli, prefix: wtrep, count: 44}
  - property: ce:variance
    value:
      formula: "sum((theta_r - theta)^2) / (R * (1 - k)^2)"
      byRelease:
        - {releases: "<=2024", method: brr, R: 44, k: 0}
        # Fay-adjusted: all 44 replicate weights are positive on every 2025
        # fmli row. Method, R and k confirmed against the BLS standard errors
        # page (ce-standarderrors.htm) on 2026-11-20.
        - {releases: ">=2025", method: fay, R: 44, k: 0.5}
  - property: ce:referencePeriod
    value: three months before the interview month
  - property: ce:breaks
    value:
      - {id: BRK_2023_QUESTIONNAIRE, from: 2023, kind: question_or_coding, affects: TBD}
      - {id: BRK_2025_SAMPLE_REDESIGN, from: 2025, kind: sample_or_weighting, affects: all}
      - {id: BRK_2025_COLLECTION_GAP, from: 2025-10-01, to: 2025-11-12, kind: disruption, affects: all}
  - property: ce:geographyLevels
    value: {region: reliable, division: reliable, state: limited, belowState: unsupported}

  # ── Table list ───────────────────────────────────────────────────────────
  - property: ce:tables
    value:
      - {sidecar: ce-interview-fmli, version: 0.4.0, rowRepresents: consumer_unit_interview, carriesWeight: true}
      - {sidecar: ce-interview-memi, version: 0.1.0, rowRepresents: member_interview, carriesWeight: false}
      - {sidecar: ce-interview-mtbi, version: 0.1.0, rowRepresents: expenditure_item_month, carriesWeight: false}
      - {sidecar: ce-interview-itbi, version: 0.1.0, rowRepresents: income_item_month, carriesWeight: false}
      - {sidecar: ce-interview-itii, version: 0.1.0, rowRepresents: imputed_income_item_month, carriesWeight: false}
      # >>> expn tables: written by `ce-sidecars sync-master`; do not edit
      - {sidecar: ce-interview-expn_apa, version: 0.1.0, rowRepresents: expn_record, carriesWeight: false}
