  # ── Relationships ────────────────────────────────────────────────────────
  # Parent -> child on newid: the child takes the interview's weight.
  # Same unit on cuid: groups one unit's rows; never a weight route.
  - property: ce:relationships
    value:
      - parent: ce-interview-fmli
        child: ce-interview-memi
        keys: {parent: [newid], child: [newid]}
        cardinality: one_to_many
        childRowsOptional: false
        weightFrom: parent
        note: Every interview has at least one member row.
      - parent: ce-interview-fmli
        child: ce-interview-mtbi
        keys: {parent: [newid], child: [newid]}
        cardinality: one_to_many
        childRowsOptional: true
        weightFrom: parent
        note: A consumer unit with no reported spending has no child rows.
      - parent: ce-interview-fmli
        child: ce-interview-itbi
        keys: {parent: [newid], child: [newid]}
        cardinality: one_to_many
        childRowsOptional: true
        weightFrom: parent
        note: No income item rows means zero, not missing.
      - parent: ce-interview-fmli
        child: ce-interview-itii
        keys: {parent: [newid], child: [newid]}
        cardinality: one_to_many
        childRowsOptional: true
        weightFrom: parent
        note: >
          Five imputed versions (impnum 1-5) per income item and month; average
          estimates across versions. 54 of the 2025 interviews have no rows.
      - parent: ce-interview-fmli
        child: ce-interview-fmli
        keys: {parent: [cuid], child: [cuid]}
        cardinality: same_unit
        weightFrom: self
        note: >
          The interviews of one consumer unit: up to four, at most one per
          quarter. Each keeps its own weight; weights are never added across them.
      - parent: ce-interview-memi
        child: ce-interview-memi
        keys: {parent: [cuid, membno], child: [cuid, membno]}
        cardinality: same_unit
        weightFrom: self
        note: >
          One member across the consumer unit's interviews: up to four rows, at
          most one per quarter. Each row takes its weight through its own
          interview's fmli row.
