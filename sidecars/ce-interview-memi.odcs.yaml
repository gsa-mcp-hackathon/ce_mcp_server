description:
  purpose: 'Characteristics, work and income of each member of a consumer unit, from the BLS
    Consumer Expenditure Interview Survey.

    '
  limitations: 'Rows are people, not consumer units. A member-level value cannot be weighted
    directly with the consumer-unit weight: resolve or aggregate it to newid first, then use
    the weight of the fmli row with the same newid. A member can appear in up to four quarterly
    interviews. See the master sidecar for the survey design.

    '
  usage: 'Member-level characteristics and income, and filters on who is in a consumer unit.

    '
