description:
  purpose: 'Detailed expenditure records from the Interview questionnaire section "Home Improvement,
    Repairs, and Home Services" (BLS file HSV), as loaded.

    '
  limitations: 'A consumer unit has rows only when the section applied to it, and may have
    several. BLS releases the file for five quarters at once; it is stored by interview quarter
    (qyear). See the master sidecar for the survey design.

    '
