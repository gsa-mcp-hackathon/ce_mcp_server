tenant: TBD
description:
  purpose: 'Monthly expenditures of each consumer unit by item code (UCC), from the BLS Consumer
    Expenditure Interview Survey.

    '
  limitations: 'The table carries no weight: sum its rows to newid, then use the weight of
    the fmli row with the same newid. An interview with no reported spending has no rows here,
    which counts as zero, not as missing. Item codes are grouped only through the UCC hierarchy,
    which is not in the project yet. See the master sidecar for the survey design.

    '
  usage: 'Spending by item and reference month. Each row says which month it belongs to, so
    no previous-quarter and current-quarter pair is involved.

    '
