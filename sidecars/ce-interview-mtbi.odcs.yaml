  - name: cost
    id: cost
    businessName: Total cost of item, including sales tax
    logicalType: number
    description: 'Total cost of the item in its reference month, including sales tax. Not
      every item code is spending: some hold asset values, loan amounts and purchase prices,
      and reductions of loan principal are negative. Filter by ucc before summing; the sum
      of all rows is not total spending.

      '
    customProperties:
    - property: ce:sourceName
      value: COST
    - property: ce:role
      value: measure
    - property: ce:scale
      value: ratio
    - property: ce:unit
      value: usd_monthly
    - property: ce:level
      value: consumer_unit
    - property: ce:additiveOver
      value:
      - consumer_units
      - months_in_scope
    - property: ce:topcoded
      value: true
    - property: ce:topcodeMethod
      value: replaced_by_mean_above_critical_value
  - name: pubflag
    id: pubflag
    businessName: Is amount included in published reports?
    logicalType: string
    description: Is amount included in published reports?
    enum:
    - value: '1'
      label: Not published
    - value: '2'
      label: Published in Integrated Bulletin
    customProperties:
    - property: ce:sourceName
      value: PUBFLAG
    - property: ce:role
      value: dimension
    - property: ce:scale
      value: nominal
  - name: quarter
    id: quarter
    businessName: Quarter (1-4)
    logicalType: integer
    required: true
    description: Added by the loader, from the file name.
    customProperties:
    - property: ce:role
      value: period
    - property: ce:scale
      value: ordinal
  - name: quarter_code
    id: quarter_code
    businessName: Quarter code (partition)
    logicalType: string
    required: true
    description: 'Added by the loader, from the file name: 1x is quarter 1 of the release
