            weighted: {value: false, evidence: "No weights"}
      answers:
        - {asks: "What's the plain average of total spending across interviewed households", node: n1}
    expect:
      status: captured
      resolved:
        n1: {weight: null, standard_error: false}
      outcome:
        n1: {verdict: warn, method: do_calendar_pair_mean, weighted: false, rules: [unweighted_mean], not_rules: [gap_2025_as_released]}

