      accept_status: [not_captured, needs_clarification]

  - id: share-of-income-spent
    nuance: [share_ratio, ratio]
    mistake: "A share node, or a mean of each household's own ratio."
    message: "What share of their income before taxes did households spend in 2025, as released?"
    gold:
      nodes:
        - id: n1
          kind: estimate
          statistic: mean
          measure: {table: fmli, column: totexpcq}
          period: {text: "in 2025", kind: year, values: [2025]}
          stated:
            gap_2025: {value: as_released, evidence: "as released"}
        - id: n2
          kind: estimate
          statistic: mean
          measure: {table: fmli, column: fincbtxm}
          period: {text: "in 2025", kind: year, values: [2025]}
          stated:
            gap_2025: {value: as_released, evidence: "as released"}
        - id: n3
          kind: combine
          statistic: ratio
          inputs: {numerator: n1, denominator: n2}
      answers:
        - {asks: "What share of their income before taxes did households spend", node: n3}
    also:
      - nodes: [{node: n1, statistic: total}, {node: n2, statistic: total}]
    expect:
      status: captured
      resolved:
        n3: {conversion: none}
      outcome:
        n3: {verdict: warn, method: ratio, rules: [carried]}

