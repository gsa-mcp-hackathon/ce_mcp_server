  # ── the statistic ──────────────────────────────────────────────────────────
  - id: median-income
    nuance: [median]
    mistake: "Computing a mean and calling it the median."
    message: "What was median household income before taxes in 2025, as released?"
    gold:
      nodes: []
      reason_code: statistic_not_supported
      reason: "A median is not available: the server computes means, totals, counts, ratios and differences."
    expect:
      status: not_captured
      accept_status: [not_captured, needs_clarification]

  - id: ninetieth-percentile
    nuance: [median]
    mistake: "Substituting a mean or a top-coded maximum for a percentile."
    message: "What is the 90th percentile of total household spending in 2025, as released?"
    gold:
      nodes: []
      reason_code: statistic_not_supported
      reason: "Percentiles are not available: the server computes means, totals, counts, ratios and differences."
    expect:
