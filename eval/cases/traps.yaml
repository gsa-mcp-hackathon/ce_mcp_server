  # ── weights and standard errors ────────────────────────────────────────────
  - id: plain-average-no-weights
    nuance: [weights]
    mistake: "Applying the weights although the user declined them."
    message: "What's the plain average of total spending across interviewed households in 2025, as released? No weights."
    gold:
      nodes:
        - id: n1
